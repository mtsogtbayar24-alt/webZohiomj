<style>
.svg{
width: 100%;
max-width: 100%;
height: auto;
display: block;
margin-bottom: 20px;
}

/* Анимешнүүд */

.cloud1 {
  animation: cloudMove1 18s linear infinite alternate;
}
.cloud2 {
  animation: cloudMove2 22s linear infinite alternate;
}
.cloud3 {
  animation: cloudMove3 20s linear infinite alternate;
}

.bird1 {
  animation: birdFly1 6s ease-in-out infinite;
}
.bird2 {
  animation: birdFly2 7s ease-in-out infinite;
}

.tree {
  transform-origin: bottom center;
  animation: sway 3s ease-in-out infinite;
}

.bush {
  transform-origin: bottom center;
  animation: swaySmall 2.5s ease-in-out infinite;
}

.redCar {
  animation: moveRedCar 10s linear infinite;
}

.blueCar {
  animation: moveBlueCar 10s linear infinite;
}

.lampLight {
  animation: lampBlink 2s ease-in-out infinite;
}

.skyDay {
  animation: skyToNight 16s ease-in-out infinite;
}

.sun {
  transform: translateX(0px) translateY(150px);
  animation: sunCycle 16s linear infinite;
  opacity: 1;
}

.moon {
  transform: translateX(0px) translateY(150px);
  animation: moonCycle 16s linear infinite;
  opacity: 0;
}

.windowLight {
  animation: windowNightLight 16s ease-in-out infinite;
}

.lampNight {
  animation: lampNightGlow 16s ease-in-out infinite;
}

@keyframes sunCycle {
  0%   { transform: translateX(0px) translateY(150px); opacity: 1; }
  25%  { transform: translateX(450px) translateY(50px); opacity: 1; }
  50%  { transform: translateX(900px) translateY(150px); opacity: 0; }
  100% { transform: translateX(0px) translateY(150px); opacity: 0; }
}

@keyframes moonCycle {
  0%   { transform: translateX(0px) translateY(150px); opacity: 0; }
  50%  { transform: translateX(0px) translateY(150px); opacity: 1; }
  75%  { transform: translateX(450px) translateY(50px); opacity: 1; }
  100% { transform: translateX(900px) translateY(150px); opacity: 0; }
}

@keyframes cloudMove1 {
  0% { transform: translateX(0); }
  100% { transform: translateX(30px); }
}

@keyframes cloudMove2 {
  0% { transform: translateX(0); }
  100% { transform: translateX(-25px); }
}

@keyframes cloudMove3 {
  0% { transform: translateX(0); }
  100% { transform: translateX(20px); }
}

@keyframes birdFly1 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(18px, -8px); }
}

@keyframes birdFly2 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-15px, -6px); }
}

@keyframes sway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(2deg); }
}

@keyframes swaySmall {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(3deg); }
}

@keyframes moveRedCar {
  0% { transform: translateX(0); }
  100% { transform: translateX(900px); }
}

@keyframes moveBlueCar {
  0% { transform: translateX(0); }
  100% { transform: translateX(-900px); }
}

@keyframes lampBlink {
  0%, 100% { opacity: 0.95; }
  50% { opacity: 0.6; }
}

@keyframes skyToNight {
  0%   { fill: #87CEEB; }
  25%  { fill: #4FC3F7; }
  50%  { fill: #FFB74D; }
  75%  { fill: #1A237E; }
  100% { fill: #87CEEB; }
}

@keyframes windowNightLight {
  0%, 55% {
    fill: #B3E5FC;
    opacity: 1;
  }
  70%, 90% {
    fill: #FFF176;
    opacity: 1;
  }
  100% {
    fill: #B3E5FC;
    opacity: 1;
  }
}

@keyframes lampNightGlow {
  0%, 55% {
    opacity: 0.3;
  }
  70%, 90% {
    opacity: 1;
  }
  100% {
    opacity: 0.3;
  }
}
</style>
